<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1e4029" />
<meta name="description" content="GiftWrap finds real gifts within your budget, you approve the one you like, and Prava mints a one-time card locked to that exact price and merchant — nothing more can ever be charged." />
<title>GiftWrap — agentic gifting powered by Prava</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231e4029'/%3E%3Cg fill='none' stroke='%23e8cf94' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='10' width='16' height='10' rx='1.2'/%3E%3Cpath d='M4 13.5h16'/%3E%3Cpath d='M12 10v10'/%3E%3Cpath d='M12 10C10.6 6.6 7 6.4 7 8.7 7 10 8.6 10 12 10Z'/%3E%3Cpath d='M12 10c1.4-3.4 5-3.6 5-1.3C17 10 15.4 10 12 10Z'/%3E%3C/g%3E%3C/svg%3E" />
<!-- Absolute /static paths: main.py serves this file at "/", where relative
     asset URLs would resolve to /style.css and /app.js and 404. -->
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="9" width="18" height="12" rx="1.4"></rect>
            <path d="M3 13h18"></path>
            <path d="M12 9v12"></path>
            <path d="M12 9C10.3 4.8 6 4.6 6 7.4 6 9 8 9 12 9Z"></path>
            <path d="M12 9c1.7-4.2 6-4.4 6-1.6C18 9 16 9 12 9Z"></path>
          </svg>
        </span>
        <div class="app-header-titles">
          <h1>GiftWrap</h1>
          <p class="subtitle">Agentic gifting, powered by Prava</p>
        </div>
      </div>
      <div id="budget-chip" class="budget-chip" hidden>
        <svg class="budget-chip-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <span><span id="budget-amount">—</span> cap<span class="budget-chip-detail"> · enforced by Prava</span></span>
      </div>
    </header>

    <main id="chat-log" class="chat-log" aria-live="polite"></main>

    <div id="typing-indicator" class="typing-indicator" hidden>
      <span class="typing-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="9" width="18" height="12" rx="1.4"></rect>
          <path d="M3 13h18"></path>
          <path d="M12 9v12"></path>
          <path d="M12 9C10.3 4.8 6 4.6 6 7.4 6 9 8 9 12 9Z"></path>
          <path d="M12 9c1.7-4.2 6-4.4 6-1.6C18 9 16 9 12 9Z"></path>
        </svg>
      </span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <form id="chat-form" class="chat-input-row" autocomplete="off">
      <input
        id="chat-input"
        type="text"
        placeholder="Who are you gifting, and what's the budget?"
        aria-label="Message"
        autocomplete="off"
      />
      <button id="send-btn" type="submit">
        <span>Send</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"></path>
          <path d="M22 2 15 22l-4-9-9-4 20-7Z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/modal.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
