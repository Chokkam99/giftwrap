<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1e4029" />
<title>You've got a gift — GiftWrap</title>
<!-- Absolute /static paths: main.py serves this at /gift/{token}, where relative
     asset URLs would resolve under /gift/ and 404. -->
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app gift-app">
    <header class="app-header">
      <div class="app-header-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="9" width="18" height="12" rx="1.4"></rect>
            <path d="M3 13h18"></path>
            <path d="M12 9v12"></path>
            <path d="M12 9C10.3 4.8 6 4.6 6 7.4 6 9 8 9 12 9Z"></path>
            <path d="M12 9c1.7-4.2 6-4.4 6-1.6C18 9 16 9 12 9Z"></path>
          </svg>
        </span>
        <div class="app-header-titles">
          <h1>GiftWrap</h1>
          <p class="subtitle">Someone picked you</p>
        </div>
      </div>
    </header>

    <main id="gift-main" class="gift-main">
      <p class="gift-state">Loading your gift…</p>
    </main>
  </div>

  <script src="/static/modal.js"></script>
  <script src="/static/gift.js"></script>
</body>
</html>
