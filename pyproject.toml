[project]
name = "giftwrap"
version = "0.1.0"
description = "Agentic Gifting — budget-scoped AI gifting agent powered by Prava + Shopify UCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "httpx",
    "playwright",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[[tool.uv.index]]
# Corporate Nexus mirror is unreachable from this machine — pin to PyPI directly.
url = "https://pypi.org/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
