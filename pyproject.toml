[project]
name = "giftwrap"
version = "0.1.0"
description = "Agentic Gifting — budget-scoped AI gifting agent powered by Prava + Shopify UCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "httpx",
    "playwright",
    "python-dotenv",
    "openai>=2.52.0",
    "google-genai>=2.16.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
